<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Gizem Website</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // Served whenever GitHub Pages can't find a static file for the request
      // (e.g. a deep client-side route like /tr/iletisim). Redirects to the
      // root with the original path encoded in the query string so index.html
      // can restore it before React Router mounts.
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/?/' +
        l.pathname.slice(1).replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
